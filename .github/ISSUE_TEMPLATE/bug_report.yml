name: Bug Report
description: Segnala un malfunzionamento o un errore nella web app / PWA
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrizione del problema
      description: Spiega in modo chiaro cosa non funziona.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Come riprodurlo
      description: Elenca i passaggi esatti per far apparire il problema.
      value: |
        1. Vai su ...
        2. Clicca su ...
        3. Osserva l'errore
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento atteso
      description: Cosa avrebbe dovuto succedere?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento attuale
      description: Cosa succede invece? (Incolla qui eventuali errori a schermo o in console)
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Dispositivo
      options:
        - PC / Laptop
        - Smartphone
        - Tablet
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS / iPadOS
        - ChromeOS
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Safari
        - Edge
        - Firefox
        - Samsung Internet
        - Altro
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Modalità di utilizzo
      options:
        - Browser (scheda web normale)
        - PWA installata (icona su schermata home / desktop)
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Stato della connessione
      options:
        - Online (normale)
        - Offline
        - Rete lenta / instabile
    validations:
      required: true